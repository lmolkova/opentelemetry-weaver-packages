# Markdown documentation generation for a semantic convention registry.
# See README.md for what this package generates and full parameter docs.
# Override params per registry via `--param key=value` or your own copy of this file.
params:
  # Output toggles
  generate_attribute_registry: true
  generate_entity_registry: true
  generate_span_registry: true
  generate_metric_registry: true
  generate_event_registry: true

  # Signal & attribute selection (forwarded to semconv_grouped_attributes / semconv_signal)
  exclude_deprecated: true
  stable_only: false
  exclude_root_namespace: []

  # Headings
  humanize_headings: false

  # Links (read by links.j2)
  registry_base_url: /docs/registry
  otel_requirement_level_url: https://opentelemetry.io/docs/specs/semconv/general/attribute-requirement-level/
  otel_naming_recommendations_url: https://opentelemetry.io/docs/specs/semconv/general/naming/#recommendations-for-application-developers
  otel_recording_errors_url: https://opentelemetry.io/docs/specs/semconv/general/recording-errors/
  otel_span_guidelines_url: https://opentelemetry.io/docs/specs/otel/trace/api/#span

# Acronyms interpreted by the `acronym` filter when title-casing namespaces.
# acronyms: please specify in weaver.toml

# Where each dependency's attributes are documented, keyed by its schema url.
# Values are url templates with `{namespace}` substituted. No defaults: schema
# urls are versioned, so only your registry knows them. Specify in weaver.toml:
#
#   [template.text_maps.upstream_docs]
#   "https://opentelemetry.io/schemas/1.39.0" = "https://github.com/open-telemetry/semantic-conventions/blob/main/docs/registry/attributes/{namespace}.md"
#
# Attributes from an unlisted dependency are rendered without a link.

templates:
  # Registry index (top-level README) and one README per namespace. Both share the
  # same combined filter: a per-namespace bundle of every signal type, so the
  # per-namespace README can list whatever the namespace defines and link to it.
  - template: registry_readme.md.j2
    when: $generate_attribute_registry or $generate_entity_registry or $generate_span_registry or $generate_metric_registry or $generate_event_registry
    filter: &combined_filter |-
      {v2: true, exclude_deprecated: $exclude_deprecated, stable_only: $stable_only, exclude_root_namespace: $exclude_root_namespace} as $opts
      | {
        spans:      (semconv_grouped_spans($opts)      | map({key: .root_namespace, value: .spans})    | from_entries),
        metrics:    (semconv_grouped_metrics($opts)    | map({key: .root_namespace, value: .metrics})  | from_entries),
        events:     (semconv_grouped_events($opts)     | map({key: .root_namespace, value: .events})   | from_entries),
        entities:   (semconv_signal("entity"; $opts) | group_by(.root_namespace) | map({key: .[0].root_namespace, value: (. | sort_by(.type))}) | from_entries),
        attributes: (semconv_grouped_attributes($opts) | map({key: .root_namespace, value: .attributes}) | from_entries),
        metric_refinements: (.refinements.metrics | map(select(.id != .name)) | map(select(if $opts.exclude_deprecated then (.deprecated == null) else true end)) | map(select(if $opts.stable_only then (.stability == "stable") else true end)) | map(. + {_ns: (.id | split(".")[0])}) | group_by(._ns) | map({key: .[0]._ns, value: .}) | from_entries),
        entity_refinements: (.refinements.entities | map(select(.id != .type)) | map(select(if $opts.exclude_deprecated then (.deprecated == null) else true end)) | map(select(if $opts.stable_only then (.stability == "stable") else true end)) | map(. + {_ns: (.id | split(".")[0])}) | group_by(._ns) | map({key: .[0]._ns, value: .}) | from_entries)
      } as $byns
      | ([$byns.spans, $byns.metrics, $byns.events, $byns.entities, $byns.attributes, $byns.metric_refinements, $byns.entity_refinements] | map(keys) | add | unique)
      | map({
          root_namespace: .,
          spans:              ($byns.spans[.]              // []),
          metrics:            ($byns.metrics[.]            // []),
          events:             ($byns.events[.]             // []),
          entities:           ($byns.entities[.]           // []),
          attributes:         ($byns.attributes[.]         // []),
          metric_refinements: ($byns.metric_refinements[.] // []),
          entity_refinements: ($byns.entity_refinements[.] // [])
        })
    application_mode: single
    file_name: README.md

  - template: namespace_readme.md.j2
    when: $generate_attribute_registry or $generate_entity_registry or $generate_span_registry or $generate_metric_registry or $generate_event_registry
    filter: *combined_filter
    application_mode: each
    file_name: "{{ ctx.root_namespace | kebab_case }}/README.md"

  # Signal pages: one per namespace that defines that signal. The grouped helpers
  # select the signals, group them by root namespace, and sort them for stable output.
  - template: span_namespace.md.j2
    when: $generate_span_registry
    filter: |-
      semconv_grouped_spans({v2: true, exclude_deprecated: $exclude_deprecated, stable_only: $stable_only, exclude_root_namespace: $exclude_root_namespace})
    application_mode: each
    file_name: "{{ ctx.root_namespace | kebab_case }}/spans.md"

  # Each metric also gets the refinements of it, wherever they are defined. `_idx`
  # is the refinement's position among same-named headings on its namespace's
  # metric-refinements.md (current first, then deprecated) - the anchor's `-N`.
  - template: metric_namespace.md.j2
    when: $generate_metric_registry
    filter: |-
      ({exclude_deprecated: $exclude_deprecated, stable_only: $stable_only} as $opts
        | .refinements.metrics
        | map(select(.id != .name))
        | map(select(if $opts.exclude_deprecated then (.deprecated == null) else true end))
        | map(select(if $opts.stable_only then (.stability == "stable") else true end))
        | map(. + {_ns: (.id | split(".")[0])})) as $refs
      | ($refs | map(. as $r | {id, name, _ns, _idx: ([$refs[] | select(._ns == $r._ns and .name == $r.name)]
          | (map(select(.deprecated == null)) + map(select(.deprecated != null)))
          | to_entries | map(select(.value.id == $r.id)) | .[0].key)})) as $refs
      | semconv_grouped_metrics({v2: true, exclude_deprecated: $exclude_deprecated, stable_only: $stable_only, exclude_root_namespace: $exclude_root_namespace})
      | map(.metrics |= map(. as $m | . + {refinements: ($refs | map(select(.name == $m.name)) | sort_by(._ns))}))
    application_mode: each
    file_name: "{{ ctx.root_namespace | kebab_case }}/metrics.md"

  # Metric refinements page: one per namespace that defines refinements of upstream metrics.
  # `_base_local` says whether the refined metric is defined in this registry (so
  # it can be linked); `_added` / `_changed` list attribute keys the refinement
  # adds or whose requirement level it changes, relative to that metric.
  - template: metric_refinements_namespace.md.j2
    when: $generate_metric_registry
    filter: |-
      {exclude_deprecated: $exclude_deprecated, stable_only: $stable_only} as $opts
      | (.registry.metrics | map({key: .name, value: ((.attributes // []) | map({key: .key, value: .requirement_level}) | from_entries)}) | from_entries) as $base
      | .refinements.metrics
      | map(select(.id != .name))
      | map(select(if $opts.exclude_deprecated then (.deprecated == null) else true end))
      | map(select(if $opts.stable_only then (.stability == "stable") else true end))
      | map(. + {_ns: (.id | split(".")[0])})
      | map(. as $r | $base[$r.name] as $b | . + {
          _base_local: ($b != null),
          _added: (if $b == null then [] else [($r.attributes // [])[] | select(.key as $k | $b | has($k) | not) | .key] end),
          _changed: (if $b == null then [] else [($r.attributes // [])[] | select(.key as $k | ($b | has($k)) and $b[$k] != .requirement_level) | .key] end)})
      | group_by(._ns)
      | map({root_namespace: .[0]._ns, metric_refinements: .})
    application_mode: each
    file_name: "{{ ctx.root_namespace | kebab_case }}/metric-refinements.md"

  - template: event_namespace.md.j2
    when: $generate_event_registry
    filter: |-
      semconv_grouped_events({v2: true, exclude_deprecated: $exclude_deprecated, stable_only: $stable_only, exclude_root_namespace: $exclude_root_namespace})
    application_mode: each
    file_name: "{{ ctx.root_namespace | kebab_case }}/events.md"

  - template: entity_namespace.md.j2
    when: $generate_entity_registry
    filter: |-
      ({exclude_deprecated: $exclude_deprecated, stable_only: $stable_only} as $opts
        | .refinements.entities
        | map(select(.id != .type))
        | map(select(if $opts.exclude_deprecated then (.deprecated == null) else true end))
        | map(select(if $opts.stable_only then (.stability == "stable") else true end))
        | map(. + {_ns: (.id | split(".")[0])})) as $refs
      | ($refs | map(. as $r | {id, type, _ns, _idx: ([$refs[] | select(._ns == $r._ns and .type == $r.type)]
          | (map(select(.deprecated == null)) + map(select(.deprecated != null)))
          | to_entries | map(select(.value.id == $r.id)) | .[0].key)})) as $refs
      | semconv_signal("entity"; {v2: true, exclude_deprecated: $exclude_deprecated, stable_only: $stable_only, exclude_root_namespace: $exclude_root_namespace})
      | group_by(.root_namespace)
      | map({ root_namespace: .[0].root_namespace, entities: (. | sort_by(.type) | map(. as $e | . + {refinements: ($refs | map(select(.type == $e.type)) | sort_by(._ns))})) })
    application_mode: each
    file_name: "{{ ctx.root_namespace | kebab_case }}/entities.md"

  # Entity refinements page: one per namespace that defines refinements of upstream entities.
  # Same `_base_local` / `_added` / `_changed` as metric refinements, over the
  # entity's identity and description attributes.
  - template: entity_refinements_namespace.md.j2
    when: $generate_entity_registry
    filter: |-
      {exclude_deprecated: $exclude_deprecated, stable_only: $stable_only} as $opts
      | (.registry.entities | map({key: .type, value: (((.identity // []) + (.description // [])) | map({key: .key, value: .requirement_level}) | from_entries)}) | from_entries) as $base
      | .refinements.entities
      | map(select(.id != .type))
      | map(select(if $opts.exclude_deprecated then (.deprecated == null) else true end))
      | map(select(if $opts.stable_only then (.stability == "stable") else true end))
      | map(. + {_ns: (.id | split(".")[0])})
      | map(. as $r | $base[$r.type] as $b | (((.identity // []) + (.description // []))) as $attrs | . + {
          _base_local: ($b != null),
          _added: (if $b == null then [] else [$attrs[] | select(.key as $k | $b | has($k) | not) | .key] end),
          _changed: (if $b == null then [] else [$attrs[] | select(.key as $k | ($b | has($k)) and $b[$k] != .requirement_level) | .key] end)})
      | group_by(._ns)
      | map({root_namespace: .[0]._ns, entity_refinements: .})
    application_mode: each
    file_name: "{{ ctx.root_namespace | kebab_case }}/entity-refinements.md"
